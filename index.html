<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบบริหารจัดการที่ราชพัสดุ | ธนารักษ์พื้นที่หนองบัวลำภู</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Sarabun', 'sans-serif'] },
          colors: {
            gov: { DEFAULT: '#0f5132', light: '#198754', dark: '#083a22' },
            gold: { DEFAULT: '#d4af37', light: '#fcd34d' }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-image: url('https://images.unsplash.com/photo-1589829085413-56de8ae18c73?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .loading-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(255,255,255,0.8); z-index: 9999;
      display: none; justify-content: center; align-items: center;
      flex-direction: column;
    }
  </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

  <div id="loadingOverlay" class="loading-overlay">
    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-gov"></div>
    <p class="mt-4 text-gov font-bold text-lg" id="loadingText">กำลังเชื่อมต่อฐานข้อมูล...</p>
  </div>

  <div class="glass-card w-full max-w-md p-8 relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-gov to-gold"></div>
    
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-gov text-white rounded-full mb-4 shadow-lg border-4 border-white">
        <i class="fa-solid fa-map-location-dot text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">ระบบบริหารจัดการที่ราชพัสดุ</h1>
      <p class="text-gray-500 text-sm mt-1">สำนักงานธนารักษ์พื้นที่หนองบัวลำภู</p>
    </div>

    <form id="loginForm" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อผู้ใช้งาน (Username)</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fa-solid fa-user text-gray-400"></i>
          </div>
          <input type="text" id="username" required 
            class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gov focus:border-gov outline-none transition" 
            placeholder="กรอกชื่อผู้ใช้งาน">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน (Password)</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fa-solid fa-lock text-gray-400"></i>
          </div>
          <input type="password" id="password" required 
            class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gov focus:border-gov outline-none transition" 
            placeholder="กรอกรหัสผ่าน">
        </div>
      </div>

      <button type="submit" 
        class="w-full bg-gradient-to-r from-gov to-green-700 text-white font-bold py-3 rounded-lg shadow-md hover:shadow-lg hover:from-green-800 hover:to-gov transition duration-300 transform hover:-translate-y-0.5">
        เข้าสู่ระบบ
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-gray-400">
      <p>© 2025 TRD Nong Bua Lam Phu. All rights reserved.</p>
      <p class="mt-1">v2.0 Serverless Edition</p>
    </div>
  </div>

  <script>
    // --- CONFIGURATION ---
    const API_URL = "https://script.google.com/macros/s/AKfycbwn9wUL5t-GGYFmRYxQWbnuU3M7ww_SeFCJ92QcCrDF3xChNlDFJD_umlFO2zoHcpv0/exec";

    // --- SYSTEM LOGIC ---
    const loginForm = document.getElementById('loginForm');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');

    // ตรวจสอบว่า Login ค้างไว้ไหม
    window.onload = () => {
      const savedUser = localStorage.getItem('user_session');
      if (savedUser) {
        // ถ้ามี session ให้เด้งไปหน้าตามสิทธิ์เลย (Optional: ปิดไว้ก่อนเพื่อให้เห็นหน้า Login)
        // const user = JSON.parse(savedUser);
        // redirectUser(user);
      }
    };

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userIn = document.getElementById('username').value.trim();
      const passIn = document.getElementById('password').value.trim();

      if (!userIn || !passIn) return;

      // 1. แสดง Loading
      showLoading(true, 'กำลังตรวจสอบข้อมูล...');

      try {
        // 2. ดึงข้อมูล users.json จาก Drive ผ่าน API
        const response = await fetch(`${API_URL}?action=getData&type=users`);
        const users = await response.json();

        // 3. ตรวจสอบ Username/Password (Client-side validation)
        // สมมติโครงสร้าง JSON เป็น Array: [{username: "admin", password: "123", role: "admin", name: "..."}]
        const foundUser = users.find(u => u.username === userIn && u.password === passIn);

        showLoading(false);

        if (foundUser) {
          // 4. ล็อกอินสำเร็จ: บันทึก Session
          const sessionData = {
            username: foundUser.username,
            role: foundUser.role, // 'admin' หรือ 'user'
            name: foundUser.name || foundUser.username,
            agency: foundUser.agency || '-',
            loginTime: new Date().getTime()
          };
          
          localStorage.setItem('user_session', JSON.stringify(sessionData));

          // แจ้งเตือนสวยๆ
          Swal.fire({
            icon: 'success',
            title: 'ยินดีต้อนรับ',
            text: `คุณ ${sessionData.name} เข้าสู่ระบบสำเร็จ`,
            timer: 1500,
            showConfirmButton: false
          }).then(() => {
            redirectUser(sessionData);
          });

        } else {
          // ล็อกอินไม่ผ่าน
          Swal.fire({
            icon: 'error',
            title: 'เข้าสู่ระบบไม่สำเร็จ',
            text: 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง',
            confirmButtonColor: '#0f5132'
          });
        }

      } catch (error) {
        showLoading(false);
        console.error(error);
        Swal.fire('Error', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้ กรุณาลองใหม่', 'error');
      }
    });

    function redirectUser(user) {
      if (user.role === 'admin') {
        window.location.href = 'admin.html';
      } else {
        // ผู้ใช้ทั่วไปไปหน้าตรวจสอบสถานะ หรือหน้ายื่นคำร้อง
        window.location.href = 'check_status.html'; 
      }
    }

    function showLoading(show, text) {
      loadingOverlay.style.display = show ? 'flex' : 'none';
      if(text) loadingText.innerText = text;
    }
  </script>
</body>
</html>
