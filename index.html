<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAS Connection Tester</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">🔍 ทดสอบการเชื่อมต่อ Google Apps Script</h5>
        </div>
        <div class="card-body">
            
            <label class="form-label fw-bold">ใส่ URL ของ Google Apps Script ที่นี่:</label>
            <input type="text" id="gasUrl" class="form-control mb-3" placeholder="https://script.google.com/macros/s/AKfycbxRvEyRoQaxOUWR_6pTslNmCrM7IiZTRYzDDUtPtDmrhGehUq6zQpfm9MKp_CYzVmrX/exec">
            
            <button onclick="testConnect()" class="btn btn-success w-100 mb-3">
                กดปุ่มนี้เพื่อทดสอบ
            </button>

            <hr>

            <h6 class="fw-bold">ผลลัพธ์:</h6>
            <div id="status" class="alert alert-secondary">รอการทดสอบ...</div>
            
            <label class="form-label small text-muted">Raw Response (ค่าที่ได้จากหลังบ้าน):</label>
            <textarea id="output" class="form-control" rows="10" style="font-family: monospace; font-size: 0.8rem;"></textarea>
        </div>
    </div>

    <script>
        function testConnect() {
            const url = document.getElementById('gasUrl').value.trim();
            const statusBox = document.getElementById('status');
            const outputBox = document.getElementById('output');

            if (!url) {
                alert("กรุณาใส่ URL ก่อนครับ");
                return;
            }

            statusBox.className = 'alert alert-info';
            statusBox.innerHTML = '<div class="spinner-border spinner-border-sm"></div> กำลังยิงสัญญาณไปที่ Server...';
            outputBox.value = '';

            // ลองส่งข้อมูลแบบ POST (จำลองการเช็คชื่อ)
            const payload = {
                action: 'check_user',
                userId: 'TEST_CONNECTION_PING'
            };

            fetch(url, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(async response => {
                // อ่านค่าที่ตอบกลับมา (อ่านเป็น Text ก่อนกัน Error ถ้าไม่ใช่ JSON)
                const text = await response.text();
                outputBox.value = text; // โชว์ค่าดิบๆ

                if (response.ok) {
                    try {
                        const json = JSON.parse(text);
                        // ถ้าแปลงเป็น JSON ได้ แสดงว่าเชื่อมต่อสำเร็จ
                        statusBox.className = 'alert alert-success';
                        statusBox.innerHTML = '✅ <b>เชื่อมต่อสำเร็จ!</b> (Connected)<br>ระบบอ่านค่า JSON ได้ถูกต้อง';
                        console.log("Success:", json);
                    } catch (e) {
                        // ถ้าส่งกลับมาแต่ไม่ใช่ JSON (เช่น ส่ง HTML Error กลับมา)
                        statusBox.className = 'alert alert-warning';
                        statusBox.innerHTML = '⚠️ <b>เชื่อมต่อได้ แต่ข้อมูลผิดพลาด</b><br>หลังบ้านไม่ได้ส่ง JSON กลับมา (อาจเป็น Error HTML)';
                    }
                } else {
                    statusBox.className = 'alert alert-danger';
                    statusBox.innerHTML = `❌ <b>Server Error:</b> ${response.status} ${response.statusText}`;
                }
            })
            .catch(error => {
                console.error('Fetch Error:', error);
                outputBox.value = error.message;
                
                // วิเคราะห์สาเหตุ Error พื้นฐาน
                let advice = "";
                if (error.message.includes("Failed to fetch")) {
                    advice = "<br>👉 สาเหตุ: ลิงก์ผิด หรือ ลืมเปิดสิทธิ์เป็น 'Anyone' (CORS)";
                }

                statusBox.className = 'alert alert-danger';
                statusBox.innerHTML = `❌ <b>เชื่อมต่อล้มเหลว (Network Error)</b>${advice}`;
            });
        }
    </script>
</body>
</html>
