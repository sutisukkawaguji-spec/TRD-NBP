<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard | Smart Treasury</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Sarabun', 'sans-serif'], heading: ['Prompt', 'sans-serif'] },
          colors: {
            gov: { DEFAULT: '#0f5132', light: '#198754', dark: '#083a22' },
            gold: { DEFAULT: '#d4af37', light: '#fcd34d' }
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap');
    
    body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
    h1, h2, h3, h4, .font-heading { font-family: 'Prompt', sans-serif; }
    
    /* Sidebar Transition */
    .sidebar { transition: transform 0.3s ease-in-out; }
    .sidebar-closed { transform: translateX(-100%); }
    
    /* Loading Overlay */
    .loading-overlay {
        position: absolute; inset: 0; background: rgba(255,255,255,0.8);
        display: flex; justify-content: center; align-items: center; z-index: 10;
        backdrop-filter: blur(2px);
    }
  </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

  <aside id="sidebar" class="sidebar sidebar-closed fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-white shadow-2xl md:relative md:translate-x-0 flex flex-col transition-transform duration-300">
      <div class="h-16 flex items-center px-6 bg-slate-950 border-b border-slate-800 gap-3">
          <img src="https://upload.wikimedia.org/wikipedia/th/f/f8/Logo_The_Treasury_Department.png" class="w-8 h-auto">
          <span class="font-heading font-bold text-lg tracking-wide">Smart Treasury</span>
          <button onclick="toggleSidebar()" class="md:hidden ml-auto text-slate-400"><i class="fas fa-times"></i></button>
      </div>

      <div class="p-6 border-b border-slate-800 bg-gradient-to-br from-slate-900 to-slate-800">
          <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-gold text-slate-900 flex items-center justify-center font-bold shadow-md">
                  <i class="fas fa-user"></i>
              </div>
              <div class="overflow-hidden">
                  <p class="font-heading font-bold text-sm truncate w-32" id="user-name">Loading...</p>
                  <p class="text-xs text-slate-400 truncate w-32" id="user-role">...</p>
              </div>
          </div>
      </div>

      <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
          <div onclick="redirectPage('index')" class="flex items-center px-3 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
              <i class="fas fa-home w-8 text-center"></i> <span class="font-medium">หน้าหลัก</span>
          </div>
          <div class="flex items-center px-3 py-3 rounded-lg bg-gov text-white shadow-md cursor-default">
              <i class="fas fa-chart-pie w-8 text-center"></i> <span class="font-medium">แดชบอร์ด</span>
          </div>
          <div onclick="redirectPage('check')" class="flex items-center px-3 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
              <i class="fas fa-search-location w-8 text-center"></i> <span class="font-medium">ตรวจสอบทะเบียน</span>
          </div>
          <div onclick="redirectPage('tor03')" class="flex items-center px-3 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
              <i class="fas fa-file-contract w-8 text-center"></i> <span class="font-medium">ยื่นคำขอ (ทร.)</span>
          </div>
          
          <div class="mt-8 pt-4 border-t border-slate-800">
              <div onclick="logout()" class="flex items-center px-3 py-3 rounded-lg text-red-300 hover:bg-red-900/20 hover:text-red-200 transition cursor-pointer">
                  <i class="fas fa-sign-out-alt w-8 text-center"></i> <span class="font-medium">ออกจากระบบ</span>
              </div>
          </div>
      </nav>
  </aside>

  <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden"></div>

  <main class="flex-1 flex flex-col h-screen overflow-hidden relative bg-slate-50">
      
      <header class="h-16 bg-white shadow-sm border-b border-slate-200 flex items-center justify-between px-4 md:px-8 z-30 shrink-0">
          <div class="flex items-center gap-3">
              <button onclick="toggleSidebar()" class="md:hidden text-slate-600 hover:bg-slate-100 p-2 rounded-lg"><i class="fas fa-bars text-xl"></i></button>
              <h1 class="font-heading font-bold text-xl text-slate-800">ภาพรวมการดำเนินงาน</h1>
          </div>
          <div class="text-xs text-slate-500 hidden md:block">ข้อมูล ณ วันที่ <span id="currentDate">-</span></div>
      </header>

      <div class="flex-1 overflow-y-auto p-4 md:p-8 pb-20">
          
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between relative overflow-hidden">
                  <div class="absolute right-0 top-0 h-full w-2 bg-blue-500"></div>
                  <div>
                      <p class="text-sm text-slate-500 font-medium mb-1">สถานะปกติ</p>
                      <h3 class="text-3xl font-bold text-slate-800" id="stat-normal">0</h3>
                  </div>
                  <div class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center text-blue-500 text-xl"><i class="fas fa-check-circle"></i></div>
              </div>
              
              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between relative overflow-hidden">
                  <div class="absolute right-0 top-0 h-full w-2 bg-amber-400"></div>
                  <div>
                      <p class="text-sm text-slate-500 font-medium mb-1">รอตรวจสอบ</p>
                      <h3 class="text-3xl font-bold text-slate-800" id="stat-pending">0</h3>
                  </div>
                  <div class="w-12 h-12 bg-amber-50 rounded-full flex items-center justify-center text-amber-500 text-xl"><i class="fas fa-clock"></i></div>
              </div>

              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between relative overflow-hidden">
                  <div class="absolute right-0 top-0 h-full w-2 bg-red-500"></div>
                  <div>
                      <p class="text-sm text-slate-500 font-medium mb-1">จำหน่าย/ยกเลิก</p>
                      <h3 class="text-3xl font-bold text-slate-800" id="stat-disposed">0</h3>
                  </div>
                  <div class="w-12 h-12 bg-red-50 rounded-full flex items-center justify-center text-red-500 text-xl"><i class="fas fa-times-circle"></i></div>
              </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              
              <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col h-[400px] relative">
                  <h3 class="font-heading font-bold text-slate-700 mb-4">สัดส่วนสถานะรายการ</h3>
                  <div class="flex-1 relative flex items-center justify-center">
                      <div id="chart-loader" class="loading-overlay rounded-xl">
                          <i class="fas fa-circle-notch fa-spin text-2xl text-slate-400"></i>
                      </div>
                      <canvas id="myChart"></canvas>
                  </div>
              </div>

              <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col h-[400px] relative">
                  <div class="flex justify-between items-center mb-4">
                      <h3 class="font-heading font-bold text-slate-700">รายการล่าสุด</h3>
                      <button onclick="loadDashboardData()" class="text-xs text-gov hover:underline"><i class="fas fa-sync-alt"></i> รีเฟรช</button>
                  </div>
                  
                  <div id="timeline-container" class="flex-1 overflow-y-auto pr-2 space-y-3 relative">
                      <div id="timeline-loader" class="loading-overlay rounded-xl">
                          <i class="fas fa-circle-notch fa-spin text-2xl text-slate-400"></i>
                      </div>
                      </div>
              </div>
          </div>

      </div> 
  </main>

  <script>
    // ==============================================================
    // [สำคัญ] ⚠️ แก้ไข URL ตรงนี้ให้เป็นของคุณ (เหมือนหน้า index.html) ⚠️
    // ==============================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbzDLH9PqjKh4QkYbR-ZvcSDavirJi3PDEkccZ4E14WRyXHOK2eCS0y4X1zlh13tUil-/exec';

    // --- 1. Init Session ---
    const currentUser = JSON.parse(sessionStorage.getItem('currentUser')) || { name: 'Guest', role: 'Viewer', agency: '-' };
    document.getElementById('user-name').innerText = currentUser.name;
    document.getElementById('user-role').innerText = currentUser.role.toUpperCase();
    
    // วันที่ปัจจุบัน
    const now = new Date();
    document.getElementById('currentDate').innerText = now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });

    // --- 2. Main Loader ---
    window.onload = function() {
        loadDashboardData();
    };

    // --- 3. Navigation ---
    function redirectPage(pageName) {
        window.top.location.href = API_URL + "?page=" + pageName;
    }

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('sidebar-overlay');
        sb.classList.toggle('sidebar-closed');
        ov.classList.toggle('hidden');
    }

    function logout() {
        Swal.fire({
            title: 'ออกจากระบบ?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            confirmButtonText: 'ยืนยัน'
        }).then((result) => {
            if (result.isConfirmed) {
                sessionStorage.clear();
                window.top.location.href = API_URL;
            }
        });
    }

    // --- 4. Data Loading ---
    async function loadDashboardData() {
        // Show Loaders
        document.getElementById('chart-loader').style.display = 'flex';
        document.getElementById('timeline-loader').style.display = 'flex';

        try {
            // เรียก API ไปที่ Code.gs (action=getDashboardData)
            const response = await fetch(API_URL + "?action=getDashboardData");
            const data = await response.json();

            if(data.error) throw new Error(data.message);

            renderStats(data.stats);
            renderChart(data.stats);
            renderTimeline(data.timeline);

        } catch (err) {
            console.error(err);
            document.getElementById('timeline-container').innerHTML = `<div class="text-center text-red-400 mt-10">โหลดข้อมูลล้มเหลว<br><small>${err.message}</small></div>`;
        } finally {
            // Hide Loaders
            document.getElementById('chart-loader').style.display = 'none';
            document.getElementById('timeline-loader').style.display = 'none';
        }
    }

    function renderStats(stats) {
        // Animate counting
        animateValue("stat-normal", 0, stats.normal, 1000);
        animateValue("stat-pending", 0, stats.pending, 1000);
        animateValue("stat-disposed", 0, stats.disposed, 1000);
    }

    function renderChart(stats) {
        const ctx = document.getElementById('myChart');
        if(ctx) {
            let chartStatus = Chart.getChart("myChart"); 
            if (chartStatus) chartStatus.destroy();

            new Chart(ctx, { 
                type: 'doughnut', 
                data: { 
                    labels: ['ปกติ', 'รอตรวจสอบ', 'จำหน่าย'], 
                    datasets: [{ 
                        data: [stats.normal, stats.pending, stats.disposed], 
                        backgroundColor: ['#3b82f6', '#fbbf24', '#ef4444'], 
                        borderWidth: 0 
                    }] 
                }, 
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { 
                        legend: { position: 'bottom', labels: { font: { family: "'Sarabun', sans-serif" } } } 
                    } 
                } 
            });
        }
    }

    function renderTimeline(timeline) {
        const container = document.getElementById('timeline-container');
        container.innerHTML = ''; // Clear old items
        
        if (!timeline || timeline.length === 0) {
            container.innerHTML = '<div class="text-center text-gray-400 mt-10 text-sm">ยังไม่มีรายการบันทึก</div>';
            return;
        }

        timeline.forEach(item => {
            let icon='fa-file-alt', colorBg='bg-slate-200', colorText='text-slate-600';
            
            if(item.status==='อนุมัติ'||item.status==='ปกติ') { 
                icon='fa-check-circle'; colorBg='bg-blue-100'; colorText='text-blue-600'; 
            } else if(item.status==='รอตรวจสอบ'||item.status==='Pending') { 
                icon='fa-clock'; colorBg='bg-amber-100'; colorText='text-amber-600'; 
            } else if(item.status==='จำหน่าย'||item.status==='ยกเลิก') { 
                icon='fa-times-circle'; colorBg='bg-red-100'; colorText='text-red-600'; 
            }

            const html = `
                <div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 border border-slate-100 hover:bg-white hover:shadow-sm transition">
                    <div class="w-10 h-10 rounded-lg ${colorBg} ${colorText} flex items-center justify-center shrink-0">
                        <i class="fas ${icon}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between">
                            <p class="text-sm font-bold text-slate-800 truncate">${item.type}</p>
                            <span class="text-[10px] ${colorText} bg-white border px-1 rounded">${item.status}</span>
                        </div>
                        <p class="text-xs text-slate-500 truncate">${item.detail} (${item.plotName})</p>
                        <p class="text-[10px] text-slate-400 mt-0.5"><i class="far fa-clock mr-1"></i> ${item.time}</p>
                    </div>
                </div>`;
            container.innerHTML += html;
        });
    }

    // Helper: Number Counting Animation
    function animateValue(id, start, end, duration) {
        if (start === end) return;
        const range = end - start;
        let current = start;
        const increment = end > start ? 1 : -1;
        const stepTime = Math.abs(Math.floor(duration / range));
        const obj = document.getElementById(id);
        const timer = setInterval(function() {
            current += increment;
            obj.innerHTML = current;
            if (current == end) { clearInterval(timer); }
        }, stepTime);
    }
  </script>
</body>
</html>
