<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แจ้งรื้อถอน/จำหน่าย (ทร.11) | ระบบงานธนารักษ์</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Sarabun', 'sans-serif'] },
          colors: { gov: { DEFAULT: '#0f5132', light: '#198754' }, gold: '#d4af37' }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex flex-col min-h-screen">

  <nav class="bg-gov text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center gap-4">
          <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition">
             <i class="fa-solid fa-arrow-left text-xl"></i>
          </a>
          <div>
            <span class="font-bold text-lg block leading-none">แจ้งจำหน่าย/รื้อถอน</span>
            <span class="text-xs text-green-200">แบบฟอร์ม ทร.11</span>
          </div>
        </div>
        <div class="flex items-center gap-3">
           <span id="navUser" class="text-sm font-medium hidden md:inline">Loading...</span>
           <button onclick="logout()" class="text-red-200 hover:text-white text-sm" title="ออกจากระบบ"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </div>
    </div>
  </nav>

  <main class="flex-1 max-w-3xl mx-auto py-10 px-4 w-full">
      <div class="bg-white rounded-xl shadow-lg p-8 border-t-4 border-gov">
          <h2 class="text-2xl font-bold text-gov mb-6 border-b pb-4"><i class="fa-solid fa-house-chimney-crack mr-2"></i> บันทึกแจ้งจำหน่าย (ทร.11)</h2>
          
          <form id="disposeForm" onsubmit="submitForm(event)" class="space-y-6">
              
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                      <label class="block text-sm font-bold text-gray-700 mb-1">ชื่อหน่วยงานที่แจ้ง <span class="text-red-500">*</span></label>
                      <input type="text" id="agency" class="w-full border rounded-lg p-2.5 bg-gray-50 outline-none" required readonly>
                  </div>
                  <div>
                      <label class="block text-sm font-bold text-gray-700 mb-1">หมายเลขทะเบียนที่ดิน/อาคาร <span class="text-red-500">*</span></label>
                      <input type="text" id="regNo" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-gov outline-none" placeholder="เช่น นภ.123" required>
                  </div>
              </div>

              <div>
                  <label class="block text-sm font-bold text-gray-700 mb-1">สาเหตุการจำหน่าย <span class="text-red-500">*</span></label>
                  <select id="reason" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-gov outline-none" required>
                      <option value="" disabled selected>-- เลือกสาเหตุ --</option>
                      <option value="รื้อถอนอาคาร">รื้อถอนอาคาร</option>
                      <option value="ส่งมอบคืนราชพัสดุ">ส่งมอบคืนราชพัสดุ</option>
                      <option value="ภัยธรรมชาติ/ชำรุด">ภัยธรรมชาติ/ชำรุด (ไม่สามารถใช้งานได้)</option>
                      <option value="อื่นๆ">อื่นๆ</option>
                  </select>
              </div>

              <div>
                  <label class="block text-sm font-bold text-gray-700 mb-1">รายละเอียดสิ่งปลูกสร้าง/ทรัพย์สิน <span class="text-red-500">*</span></label>
                  <textarea id="details" rows="4" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-gov outline-none" placeholder="ระบุรายละเอียด เช่น บ้านพักข้าราชการ ขนาดกว้าง x ยาว..." required></textarea>
              </div>

              <div class="pt-4 flex gap-4">
                  <button type="button" onclick="window.location.href='index.html'" class="w-1/3 bg-gray-200 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-300 transition">
                      ยกเลิก
                  </button>
                  <button type="submit" class="w-2/3 bg-gov hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow-lg transition transform active:scale-95">
                      <i class="fa-solid fa-paper-plane mr-2"></i> ส่งคำร้องขอจำหน่าย
                  </button>
              </div>
          </form>
      </div>

      <div class="mt-8">
          <h3 class="text-lg font-bold text-gray-700 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-clock-rotate-left"></i> ประวัติการแจ้งของหน่วยงานคุณ
          </h3>
          <div id="historyList" class="space-y-3">
              <div class="text-center text-gray-400 py-4"><i class="fa-solid fa-circle-notch fa-spin"></i> กำลังโหลดข้อมูล...</div>
          </div>
      </div>
  </main>

  <footer class="bg-gray-100 py-6 text-center text-xs text-gray-500">
      &copy; 2025 สำนักงานธนารักษ์พื้นที่หนองบัวลำภู
  </footer>

  <div id="loadingOverlay" class="fixed inset-0 bg-white/90 z-[100] hidden items-center justify-center flex-col">
      <div class="animate-spin text-5xl text-gov mb-4"><i class="fa-solid fa-circle-notch"></i></div>
      <p class="text-gov font-bold text-lg">กำลังบันทึกข้อมูล...</p>
  </div>

  <script>
    // ============================================
    // [สำคัญ] ⚠️ API URL
    // ============================================
    const API_URL = "https://script.google.com/macros/s/AKfycbwn9wUL5t-GGYFmRYxQWbnuU3M7ww_SeFCJ92QcCrDF3xChNlDFJD_umlFO2zoHcpv0/exec";

    let currentUser = null;

    // 1. ตรวจสอบ Login
    window.onload = () => {
        const session = sessionStorage.getItem('currentUser');
        if (!session) {
            window.location.href = 'index.html';
            return;
        }
        currentUser = JSON.parse(session);
        document.getElementById('navUser').innerText = currentUser.name || currentUser.username;
        document.getElementById('agency').value = currentUser.agency || '-';

        // โหลดประวัติ
        loadHistory();
    };

    // 2. ดึงข้อมูลประวัติการแจ้ง
    async function loadHistory() {
        const historyList = document.getElementById('historyList');
        try {
            const response = await fetch(`${API_URL}?action=getData&type=requests`);
            const data = await response.json();

            // กรองเอาเฉพาะข้อมูลของผู้ใช้นี้ และเป็นประเภท TR11
            const myRequests = data.filter(r => r.submittedBy === currentUser.username && r.type === 'TR11');

            if (myRequests.length === 0) {
                historyList.innerHTML = '<div class="bg-white p-4 rounded-lg shadow-sm text-center text-gray-500 text-sm border border-gray-100">ยังไม่มีประวัติการส่งคำร้อง</div>';
                return;
            }

            // เรียงจากใหม่ไปเก่า
            myRequests.sort((a, b) => new Date(b.submittedDate) - new Date(a.submittedDate));

            let html = '';
            myRequests.forEach(item => {
                const date = new Date(item.submittedDate).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
                let statusColor = 'bg-yellow-100 text-yellow-700 border-yellow-200';
                let statusText = item.status === 'pending' ? 'รอตรวจสอบ' : item.status;
                
                if(item.status === 'approved') { statusColor = 'bg-green-100 text-green-700 border-green-200'; statusText = 'อนุมัติ'; }
                if(item.status === 'rejected') { statusColor = 'bg-red-100 text-red-700 border-red-200'; statusText = 'ไม่อนุมัติ'; }

                html += `
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100 flex justify-between items-center transition hover:shadow-md">
                        <div>
                            <div class="font-bold text-gray-800">${item.regNo || 'ไม่ระบุเลข'} - <span class="text-sm font-normal text-gray-600">${item.details.reason}</span></div>
                            <div class="text-xs text-gray-400 mt-1"><i class="fa-regular fa-clock"></i> ${date} • ${item.id}</div>
                        </div>
                        <span class="px-2 py-1 text-xs font-bold rounded-full border ${statusColor}">${statusText}</span>
                    </div>
                `;
            });
            historyList.innerHTML = html;

        } catch (error) {
            console.error(error);
            historyList.innerHTML = '<div class="text-red-500 text-center text-sm">ไม่สามารถโหลดประวัติได้</div>';
        }
    }

    // 3. บันทึกข้อมูล
    async function submitForm(e) {
        e.preventDefault();
        showLoading(true);

        try {
            // A. เตรียมข้อมูล
            const formData = {
                id: 'TR11-' + Date.now(), 
                status: 'pending',
                submittedBy: currentUser.username,
                submittedDate: new Date().toISOString(),
                type: 'TR11',
                agency: document.getElementById('agency').value,
                regNo: document.getElementById('regNo').value,
                details: {
                    reason: document.getElementById('reason').value,
                    remark: document.getElementById('details').value
                }
            };

            // B. ดึงข้อมูลเก่า
            let existingData = [];
            try {
                const response = await fetch(`${API_URL}?action=getData&type=requests`);
                const json = await response.json();
                if (Array.isArray(json)) existingData = json;
            } catch (readErr) {
                console.warn('สร้างไฟล์ข้อมูลใหม่');
            }

            // C. เพิ่มข้อมูลใหม่
            existingData.push(formData);

            // D. บันทึกกลับ
            const saveResponse = await fetch(API_URL, {
                method: 'POST', 
                body: new URLSearchParams({
                    'action': 'saveData',
                    'type': 'requests',
                    'data': JSON.stringify(existingData)
                })
            });

            const saveResult = await saveResponse.json();
            showLoading(false);

            if (saveResult.success) {
                Swal.fire({
                    icon: 'success',
                    title: 'ส่งคำร้องสำเร็จ',
                    text: 'บันทึกข้อมูลการแจ้งจำหน่ายเรียบร้อยแล้ว',
                    confirmButtonText: 'ตกลง'
                }).then(() => {
                    document.getElementById('disposeForm').reset();
                    document.getElementById('agency').value = currentUser.agency || '-';
                    loadHistory(); // โหลดประวัติใหม่
                });
            } else {
                throw new Error('Save Failed');
            }

        } catch (error) {
            showLoading(false);
            console.error(error);
            Swal.fire('บันทึกไม่สำเร็จ', 'เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
        }
    }

    function showLoading(show) {
        document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
    }

    function logout() {
        sessionStorage.removeItem('currentUser');
        window.location.href = 'index.html';
    }
  </script>
</body>
</html>
