<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Connection Test | Premium Debugger</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6c5ce7;
            --success: #00b894;
            --error: #ff7675;
            --warning: #fdcb6e;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Outfit', 'Kanit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .status {
            padding: 16px 24px;
            border-radius: 16px;
            margin-bottom: 30px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .status.loading {
            background: rgba(253, 203, 110, 0.1);
            color: var(--warning);
            border-color: rgba(253, 203, 110, 0.2);
        }

        .status.success {
            background: rgba(0, 184, 148, 0.15);
            color: #55efc4;
            border-color: rgba(0, 184, 148, 0.3);
            box-shadow: 0 0 20px rgba(0, 184, 148, 0.1);
        }

        .status.error {
            background: rgba(255, 118, 117, 0.15);
            color: #ffaa9d;
            border-color: rgba(255, 118, 117, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        .section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border);
        }

        h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.1rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            padding: 14px;
            text-align: left;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(108, 92, 231, 0.4); }

        .btn-secondary { background: rgba(255, 255, 255, 0.1); color: var(--text); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }

        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 184, 148, 0.4); }

        .btn-warning { background: var(--warning); color: #2d3436; }
        .btn-warning:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(253, 203, 110, 0.4); }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-database me-2"></i> Supabase Premium Debugger</h1>
            <div class="actions">
                <button class="btn-secondary" onclick="runTest()"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </header>

        <div id="connection-status" class="status loading">
            <div class="loader"></div>
            <span>Checking Supabase connection...</span>
        </div>
        
        <div class="grid">
            <div class="section">
                <h3><i class="fas fa-users text-primary"></i> Table: Users (Latest 5)</h3>
                <div id="users-data" class="table-wrapper">
                    <div style="padding: 40px; text-align: center; color: var(--text-muted);">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                    </div>
                </div>
            </div>

            <div class="section">
                <h3><i class="fas fa-history text-success"></i> Table: Activities (Latest 5)</h3>
                <div id="activities-data" class="table-wrapper">
                    <div style="padding: 40px; text-align: center; color: var(--text-muted);">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                    </div>
                </div>
            </div>

            <div class="section">
                <h3><i class="fas fa-vial text-warning"></i> Test Actions</h3>
                <div class="actions">
                    <button class="btn-success" onclick="insertDummyUser()"><i class="fas fa-user-plus"></i> Insert Dummy User</button>
                    <button class="btn-warning" onclick="insertDummyActivity()"><i class="fas fa-plus-circle"></i> Insert Dummy Activity</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function runTest() {
            const statusEl = document.getElementById('connection-status');
            const usersEl = document.getElementById('users-data');
            const activitiesEl = document.getElementById('activities-data');

            statusEl.className = 'status loading';
            statusEl.innerHTML = '<div class="loader"></div><span>Fetching data from Supabase...</span>';

            if (!supabaseClient) {
                statusEl.className = 'status error';
                statusEl.innerHTML = '<i class="fas fa-times-circle"></i><span>Supabase Client not initialized. Check config.js</span>';
                return;
            }

            try {
                // Test Users Table
                const { data: users, error: userError } = await supabaseClient
                    .from('Users')
                    .select('*')
                    .order('LastDate', { ascending: false })
                    .limit(5);

                if (userError) throw userError;
                usersEl.innerHTML = renderTable(users);

                // Test Activities Table
                const { data: activities, error: activityError } = await supabaseClient
                    .from('Activities')
                    .select('*')
                    .order('Date', { ascending: false })
                    .limit(5);

                if (activityError) throw activityError;
                activitiesEl.innerHTML = renderTable(activities);

                statusEl.className = 'status success';
                statusEl.innerHTML = '<i class="fas fa-check-circle"></i><span>Connection Successful! Data retrieved and synced.</span>';

            } catch (err) {
                console.error(err);
                statusEl.className = 'status error';
                statusEl.innerHTML = `<i class="fas fa-exclamation-triangle"></i><span>Error: ${err.message || 'Unknown error'}</span>`;
                usersEl.innerHTML = '<div style="padding:20px; color:#ff7675; text-align:center;">Failed to load Users table.</div>';
                activitiesEl.innerHTML = '<div style="padding:20px; color:#ff7675; text-align:center;">Failed to load Activities table.</div>';
            }
        }

        function renderTable(data) {
            if (!data || data.length === 0) return '<div style="padding:30px; text-align:center; color:var(--text-muted);">No data found in this table.</div>';
            
            const headers = Object.keys(data[0]);
            let html = '<table><thead><tr>';
            headers.forEach(h => html += `<th>${h}</th>`);
            html += '</tr></thead><tbody>';
            
            data.forEach(row => {
                html += '<tr>';
                headers.forEach(h => {
                    let val = row[h];
                    if (typeof val === 'object') val = JSON.stringify(val);
                    html += `<td title="${val}">${val}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            return html;
        }

        async function insertDummyUser() {
            if (!supabaseClient) return;
            const dummyId = 'TEST_' + Math.random().toString(36).substr(2, 5);
            const now = new Date();
            
            try {
                const { error } = await supabaseClient.from('Users').upsert({
                    "LineID": dummyId,
                    "Name": "Test User " + dummyId,
                    "Image": "https://cdn-icons-png.flaticon.com/512/3135/3135715.png",
                    "Role": 'Guest',
                    "Score": 100,
                    "Level": 1,
                    "LastDate": now.toISOString().split('T')[0],
                    "LastTime": now.toTimeString().split(' ')[0]
                });

                if (error) throw error;
                alert('✅ Dummy user inserted successfully!');
                runTest();
            } catch (err) {
                alert('❌ Error: ' + err.message);
            }
        }

        async function insertDummyActivity() {
            if (!supabaseClient) return;
            const now = new Date();
            
            try {
                const { error } = await supabaseClient.from('Activities').insert({
                    "Date": now.toISOString().split('T')[0],
                    "Time": now.toTimeString().split(' ')[0],
                    "UUID": 'UUID_' + Date.now(),
                    "UserId": 'TEST_USER',
                    "UserName": 'Tester',
                    "Virtue": 'volunteer',
                    "Note": 'This is a test activity ' + now.toLocaleString(),
                    "Happy": 5,
                    "Status": 'waiting_verify'
                });

                if (error) throw error;
                alert('✅ Dummy activity inserted successfully!');
                runTest();
            } catch (err) {
                alert('❌ Error: ' + err.message);
            }
        }

        window.onload = runTest;
    </script>
</body>
</html>
